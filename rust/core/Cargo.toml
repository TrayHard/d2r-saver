[package]
name = "d2r-saver-core"
version = "1.0.0"
edition = "2021"
description = "Read path of d2r-saver (Blizzless D2R v105 and legacy v99 saves) without the affix solver"
license = "MIT"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

[features]
# GameData::embedded(): data/data.json and data/strings.json compiled into the binary.
embedded-data = []
